name: "Build Test and Deploy"
on:
  pull_request_target:
    branches: [ main ]
    types:
      - closed
  workflow_dispatch:
    inputs:
      version-bump:
        description: "Version bump"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      flow:
        description: "Release flow"
        type: choice
        options:
          - release
          - draft
          - dry-run
        default: release

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check-release:
    name: Check if release is needed
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      flow: ${{ steps.check.outputs.flow }}
      # The bump segment only. Consumed by the `version` job below and by nothing else — after that job
      # the version is a literal that every lane is pinned to.
      gradle-args: ${{ steps.check.outputs.gradle-args }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Determine release flow
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Manual dispatch: take flow + version bump straight from inputs (lets us recover from a
          # failed publish without opening a sham PR to flip the classifier).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ inputs.version-bump }}" in
              major) echo "gradle-args=-PincrementMajor=true" >> $GITHUB_OUTPUT ;;
              minor) echo "gradle-args=-PincrementMinor=true" >> $GITHUB_OUTPUT ;;
              *)     echo "gradle-args=" >> $GITHUB_OUTPUT ;;
            esac
            echo "flow=${{ inputs.flow }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          gradle_args=""
          if ${{ contains(github.event.pull_request.labels.*.name, 'major') }}; then
            gradle_args="-PincrementMajor=true"
          elif ${{ contains(github.event.pull_request.labels.*.name, 'minor') }}; then
            gradle_args="-PincrementMinor=true"
          fi
          echo "gradle-args=${gradle_args}" >> $GITHUB_OUTPUT

          if ${{ contains(github.event.pull_request.labels.*.name, 'skip-release') }}; then
            echo "flow=dry-run" >> $GITHUB_OUTPUT
            exit 0
          fi
          if ${{ contains(github.event.pull_request.labels.*.name, 'draft-release') }}; then
            echo "flow=draft" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Skip release when only non-code files changed. Use the paginated PR-files API (not
          # `gh pr diff`, which 406s on large PRs).
          changed_files=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[].filename')
          for file in $changed_files; do
            case "$file" in
              .github/*|*.md|.gitignore|.editorconfig|CLAUDE.md|LICENSE*|*.txt)
                ;;
              *)
                echo "Code file changed: $file"
                echo "flow=release" >> $GITHUB_OUTPUT
                exit 0
                ;;
            esac
          done
          echo "Only non-code files changed, skipping"
          echo "flow=skip" >> $GITHUB_OUTPUT

  # ONE derivation for the whole release. This is the value that names the Central upload, the git tag
  # and the GitHub release, AND the value baked into the artifacts inside the bundle — which were, until
  # this job existed, two different derivations taken minutes apart on two runners. A release landing on
  # Central between them shipped a bundle whose contents disagreed with the tag naming it.
  version:
    needs: check-release
    if: needs.check-release.outputs.flow != 'skip'
    uses: ./.github/workflows/compute-version.yaml
    with:
      gradle-args: ${{ needs.check-release.outputs.gradle-args }}

  build-linux:
    needs: [check-release, version]
    if: needs.check-release.outputs.flow != 'skip'
    uses: ./.github/workflows/build-linux.yaml
    with:
      version: ${{ needs.version.outputs.version }}

  build-apple:
    needs: [check-release, version]
    if: needs.check-release.outputs.flow != 'skip'
    uses: ./.github/workflows/build-apple.yaml
    with:
      version: ${{ needs.version.outputs.version }}

  validate:
    needs: [check-release, version, build-linux, build-apple]
    if: needs.check-release.outputs.flow != 'skip'
    uses: ./.github/workflows/validate-artifacts.yaml
    with:
      version: ${{ needs.version.outputs.version }}

  # The pre-publish consumer gate: a real downstream project resolves the merged maven-local repo,
  # compiles + links + runs the harness scenarios against it. `publish` needs this, so a release that
  # would break a consumer never reaches Central in the first place.
  consumer-smoke:
    needs: [check-release, version, build-linux, validate]
    if: needs.check-release.outputs.flow != 'skip'
    uses: ./.github/workflows/consumer-smoke.yaml
    with:
      version: ${{ needs.version.outputs.version }}
      source: maven-local
      include-macos: true

  publish:
    needs: [check-release, version, build-linux, validate, consumer-smoke]
    if: needs.check-release.outputs.flow == 'draft' || needs.check-release.outputs.flow == 'release'
    uses: ./.github/workflows/publish-to-central.yaml
    with:
      publishing-type: ${{ needs.check-release.outputs.flow == 'draft' && 'USER_MANAGED' || 'AUTOMATIC' }}
      version: ${{ needs.version.outputs.version }}
    secrets:
      GPG_KEY_CONTENTS: ${{ secrets.GPG_KEY_CONTENTS }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

  # The POST-publish half of the consumer gate: resolve the version we just pushed from Maven Central and
  # NOTHING else, cold, as an outside project would. `consumer-smoke` above proved the same consumer
  # against the pre-publish merged repo; this proves the *publish itself* — that every module and every
  # target variant genuinely landed on Central and is usable from there.
  #
  # It used to hang off the tag push in `released.yaml`. Since #128 the tag is created through the REST
  # API with `secrets.GITHUB_TOKEN`, and GitHub does not dispatch workflow events for refs created with
  # that token — so `released.yaml` silently stopped firing after v0.14.0 and six releases shipped with
  # nothing verifying what reached Central. Hanging it here removes the dependency on an event that no
  # longer arrives.
  #
  # Only the `release` flow reaches Central automatically; a `draft` publish is USER_MANAGED and has
  # nothing to resolve yet. `consumer-smoke.yaml` polls Central's eventual consistency itself (30 × 30s),
  # so this does not race the publish, and it runs alongside `finalize` rather than gating it — the
  # artifacts are on Central by then, so a red lane here is a report, not a reason to withhold the tag.
  consumer-smoke-central:
    needs: [check-release, version, publish]
    if: needs.check-release.outputs.flow == 'release'
    uses: ./.github/workflows/consumer-smoke.yaml
    with:
      version: ${{ needs.version.outputs.version }}
      source: central
      include-macos: true

  finalize:
    name: Finalize Release
    needs: [check-release, version, publish]
    if: always() && needs.check-release.outputs.flow != 'skip' && needs.check-release.outputs.flow != 'dry-run'
    runs-on: ubuntu-latest
    steps:
      # Nothing below reads the work tree any more — the tag is created through the REST API and the
      # release through `gh` — so this needs no elevated token. It used to take RELEASE_PAT (workflow
      # scope) specifically to get a tag *push* past the guard described in the tag step below; that
      # push is gone, and with it the reason to hold a broader credential in a release job.
      - uses: actions/checkout@v7

      - name: Create draft GitHub release
        if: needs.check-release.outputs.flow == 'draft' && needs.publish.result == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title || 'Manual release' }}
          PR_URL: ${{ github.event.pull_request.html_url || format('{0}/{1}', github.server_url, github.repository) }}
        run: |
          version="${{ needs.version.outputs.version }}"
          deployment_id="${{ needs.publish.outputs.deployment-id }}"
          staging_url="https://central.sonatype.com/publishing/deployments"
          gh release create "v${version}" \
              --draft --repo="$GITHUB_REPOSITORY" --title="v${version}" \
              --notes="$(cat <<EOF
          ## [${PR_TITLE}](${PR_URL})

          **Status:** Awaiting validation in [Maven Central Staging](${staging_url})
          **Deployment ID:** \`${deployment_id}\`

          Complete or cancel via the 'Complete or Cancel Release' workflow with version '${version}'.
          EOF
          )"

      - name: Create tag and GitHub release
        if: needs.check-release.outputs.flow == 'release' && needs.publish.result == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title || 'Manual release' }}
          PR_URL: ${{ github.event.pull_request.html_url || format('{0}/{1}', github.server_url, github.repository) }}
          # The commit this release was actually cut from: the merge this PR produced, or — on a manual
          # dispatch, where there is no PR — the dispatched ref's tip.
          TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          tag="v${version}"

          # Ask the API whether the tag exists, not the work tree. `actions/checkout` fetches no tags at
          # its default depth, so the `git rev-parse` this replaces could never have seen one — the
          # idempotency guard was decorative.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists — leaving it alone."
          else
            # Create the ref through REST rather than `git push` (#121). GitHub refuses a ref push from a
            # GitHub App token when the pushed tree contains workflow files, and a **tag** ref counts, so
            # every release whose range happened to touch .github/workflows/** died right here — after a
            # successful publish, leaving Central and git out of step. The REST path carries no such
            # guard and needs nothing beyond the `contents: write` this workflow already declares.
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
                -f "ref=refs/tags/${tag}" -f "sha=${TARGET_SHA}"
            echo "Tagged ${TARGET_SHA} as ${tag}."
          fi

          # Separate check, because the two halves fail independently: v0.14.0 got its tag by hand and
          # still had no release. Creating each only when missing makes a re-run finish the job rather
          # than error on the half that already succeeded.
          if gh release view "$tag" --repo="$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${tag} already exists — leaving it alone."
            exit 0
          fi
          maven_url="https://central.sonatype.com/artifact/com.ditchoom/webrtc/${version}"
          gh release create "$tag" --repo="$GITHUB_REPOSITORY" --title="${tag}" \
              --notes="$(cat <<EOF
          ## [${PR_TITLE}](${PR_URL})

          **Maven Central:** [com.ditchoom:webrtc:${version}](${maven_url})
          EOF
          )"
