
[versions]
kotlin = "2.4.0"
androidGradlePlugin = "9.2.1"
ktlint = "14.2.0"
# detekt 2.0.0-alpha.5 is built against Kotlin 2.4.0 (matches `kotlin` above).
# Plugin id moved to `dev.detekt` in 2.0. Run non-blocking with a committed baseline —
# detekt is the only static analyzer that sees the Native/JS/WASM actuals (CodeQL only
# traces JVM bytecode), so it is the multiplatform-coverage tool here.
detekt = "2.0.0-alpha.6"
mavenPublish = "0.37.0"
dokka = "2.2.0"
kover = "0.9.9"
binaryCompatibilityValidator = "0.18.1"
kotlinxCoroutines = "1.11.0"
# DitchOoM buffer stack — the zero-copy substrate this library is built on.
# 6.9.4 (latest): raw ByteStreamMux primitive (data-channel mux target), buffer-pool use-after-release
# fail-fast, codec-framed streaming layer + typed pipe, okio/sqldelight bridges. See ARCHITECTURE §4.
# 6.10.0 adds HMAC-SHA1 (buffer-crypto) + ReadBuffer.crc32 (buffer core) — DitchOoM/buffer#288 —
# consumed by webrtc-stun for STUN MESSAGE-INTEGRITY (HMAC-SHA1/SHA256) + FINGERPRINT (CRC-32). The
# 6.9.4 raw ByteStreamMux / pool fail-fast / codec-framing surface (ARCHITECTURE §4) still applies.
# 6.11.0 adds the buffer-flow **datagram trichotomy** (DatagramSource/Sink/Channel + SocketAddress +
# DatagramMux) under @ExperimentalDatagramApi — DitchOoM/buffer#291, on Maven Central. This is the
# UDP seam webrtc's transport track (W3+) rides, and the version socket-udp pins; bump keeps webrtc's
# direct buffer deps aligned with the transitive socket-udp classpath (Gradle would resolve up anyway).
# 6.16.0 landed the primitives that unblock **W4b pure-Kotlin DTLS 1.3** (the spikes are green — see
# ~/git/cinterop-issues/09-dtls-over-buffer-crypto-SPIKE-RESULTS.md): AES-ECB single block (#301, DTLS 1.3
# record-number encryption), `deriveTlsPremasterSecret` raw (EC)DHE secret (#302, the load-bearing ECDHE
# primitive for both versions), and public `exportSpki()`/`exportEncoded()` (self-signed cert).
# 6.22.0: free to bump now that the webrtc-dtls BoringSSL oracle links its OWN symbol-PREFIXED
# (-DBORINGSSL_PREFIX=webrtc_dtls_oracle) libssl+libcrypto (see webrtc-dtls/build.gradle.kts). 6.17.1+
# migrated buffer-crypto onto the canonical (unprefixed) BoringSSL bundle whose libssl duplicate-collided
# with the oracle's own libssl at the linuxTest link — the prefixing permanently decouples the two, so
# buffer/socket bump freely with the full DTLS-1.3 oracle intact. All on Maven Central.
# 6.23.0 (buffer PR #325) de-nulls the @ExperimentalDatagramApi surface, breaking, no shim: the
# datagram's addressing mode becomes a TYPE split (ConnectedDatagram{Source,Sink,Channel} with a fixed
# `peer` and no address parameter / AddressedDatagram* whose `send` requires `to` and whose
# `localAddress` is non-null by construction — ICE gathering reads it with no unwrap); the read
# sentinels `hopLimit == -1` and `localAddress == null` become zero-alloc @JvmInline value classes
# (`HopLimit` / `LocalAddress`, proven flat by a javap witness + an allocation test); `Closed.reason`
# becomes the open `DatagramCloseReason` (Normal / OsError, supertyped downstream); and send-side ECN
# becomes `EcnPreference` (OsDefault | NotEct | Ect1 | Ect0 | Ce), since `Ecn.Unknown` was double-booked
# as both "cannot report" and "do not set". One class cannot implement both source refinements — their
# `localAddress` types conflict — so an endpoint's addressing mode is fixed at construction.
# 6.25.0 (buffer PR #330, closing #328) adds `DatagramCapabilities.requiresNativeMemoryBuffers` — the
# one capability field whose PRESENCE constrains the caller rather than whose absence degrades a
# feature. It is what webrtc#131 was waiting on: "does this channel's send path demand a raw address",
# asked of the CHANNEL rather than of the platform, which is the only phrasing that does not over-reject
# (one process can run an in-memory endpoint and a real socket side by side, and NIO accepts a heap
# ByteBuffer quite happily). 6.24.0 in between is hex <-> String conversions (#324), which we do not use.
# 6.26.0 (buffer PR #335) fixes the ONE buffer-ownership gap this stack could not reach from here:
# buffer-crypto's Apple AEAD `open` took two `absoluteView` slices of the `ciphertextAndTag` it was handed
# and released neither, so on Apple every opened DTLS record pinned the *receive* chunk twice. Ours is a
# view over the received datagram and `TrackedSlice.slice()` re-parents to the root chunk, so nothing on
# our side could hand those references back. It reads the ciphertext through pointer offsets now rather
# than slices. This is what lets `DtlsRecordSeamOwnershipTest` gate its wire tracker with
# `assertPoolDrained` instead of the weaker `assertNoLeaks` — the raise-it-back condition written at that
# assertion. NOTE the skew this accepts deliberately: socket-udp's latest (4.1.3) POM still pins buffer
# 6.25.0, so Gradle resolves buffer UP to 6.26.0 underneath a socket built against 6.25.0. That is safe
# here because #335 is a pure internal fix to an Apple-only code path with no API change (the 6.25.0
# `requiresNativeMemoryBuffers` seam the pair exists to carry is untouched); revisit if the two halves
# ever diverge on API rather than on a bug fix.
#
# buffer PR #343 (first released as 6.27.1, carried unchanged in the 6.28.1 pinned below) restores
# X25519 on Android 14+ (API 34+), where Conscrypt implements it fully
# and buffer-crypto reported it `Unavailable` anyway — two provider disagreements written to the JDK's
# shape, both silent: the probe called `initialize(NamedParameterSpec.X25519)`, which Conscrypt's
# X25519-only generator refuses outright, and `rawX25519` cast to `XECPublicKey`, which
# `OpenSSLX25519PublicKey` does not implement. That flag is what `Dtls13Handshake` picks its key_share
# group from, so this is the upstream half of the Android establishment defect. Our half stays: API
# 28–33 genuinely have no X25519, so every group decision still runs over `availableGroups`.
#
# 6.28.1 is where we pin, and it *closes* a hazard 6.27.1 could only work around. For one night the
# highest version number was not the newest content: 6.28.0 was tagged from #342 at 23:42 UTC, while
# #343 merged at 23:06 and shipped as 6.27.1 at 00:40 — later, and from a commit whose parent is #342's.
# So 6.27.1 ⊃ 6.28.0, and 6.28.0 is the only version in this range missing the X25519 fix. Because
# Gradle resolves version conflicts UP, pinning 6.27.1 meant any dependency naming 6.28.0 silently
# reverted #343 and took Android 14+ back to P-256 — a capability regression that fails no build and no
# test. 6.28.1 ends that: it is both the highest number and content-complete, so resolving up is safe
# again and the pin no longer has to win an argument with the version ordering.
#
# Verified in the published `-sources.jar`, not inferred from the tag (the standing trap: a fix reaches
# a release as *content*, not as a commit). buffer-crypto's android sources at 6.28.1 are byte-identical
# to 6.27.1's, and the sole file separating 6.28.1 from 6.28.0 is `KeyAgreement.jvmCommon.kt` — the #343
# fix itself. 6.28.0 stays the one version in this line to never resolve to.
buffer = "6.29.0"
# DitchOoM socket sibling — the UDP `DatagramChannel` **actuals** webrtc's transport track binds to for
# real-network candidate gathering (host/srflx/relay). The seam itself is buffer-flow's
# `DatagramChannel` (on Central, above); `socket-udp` is only the platform real-socket implementation
# (UdpSocket.bind/connect/resolve). It ships jvm/android/js-node/linux/apple — **NOT wasmJs/browser**
# (ARCHITECTURE §1.1: browsers have no raw UDP), so it is consumed at the platform-edge gathering driver, never
# in a common/core or wasm source set. The deterministic vnet tests ride an in-memory `DatagramChannel`
# (buffer-flow interface), so they need neither socket-udp nor socket-testsuite.
# NOTE: socket's #225 "vnet" is QUIC-specific, unpublished test code (drives the internal quiche seam,
# not the public DatagramChannel; no NAT/TURN models) and `socket-testsuite` can't publish without the
# whole quiche/rust/BoringSSL stack — so webrtc builds its own vnet (ARCHITECTURE §5.2: "the WebRTC-specific
# addition"). No socket-testsuite entry here by design.
# 3.11.0 (socket PR #239) is the first release with socket-udp on Maven Central — it pins buffer 6.11.0
# and publishes all of jvm/android/js/linux/apple. The earlier merge-gate (dev against a
# publishToMavenLocal snapshot) is lifted.
# 3.15.0 (socket PR #266) adds UDP multicast: `UdpSocket.bindMulticast(...) → MulticastDatagramChannel`
# (joinGroup on 224.0.0.251 / ff02::fb) — the seam the mDNS `.local` resolver (MulticastMdnsResolver)
# binds to. Same platform set as socket-udp (jvm/android/js-node/linux/apple, NOT wasm). Its POM only
# *requires* buffer 6.11.0, so it composes with any buffer >= that; we ride buffer 6.22.0 (above),
# free to bump now that the DTLS oracle is symbol-decoupled. Unblocks CO-2 mDNS end-to-end.
# 3.16.0 (socket PR #270) is what makes Android reactivity reachable at all (webrtc#104): an
# androidx.startup initializer captures the application `Context` before app code runs, so
# `NetworkMonitor.androidOrNull()` builds a ConnectivityManager monitor with nothing asked of the app —
# plus `hasAndroidApplicationContext()` (side-effect-free, so deciding costs no callback registration),
# the sealed `MonitorMechanism` accessor, and the `reset*ForTesting` seams our Robolectric fixtures use.
# The initializer is deliberately CAPTURE-ONLY: it installs no process default, so a seam reading
# `installedProcessDefaultOrNull()` sees nothing and reports Polled. That is the bug #104 turned out to be.
# 4.0.0 is a MAJOR on two axes, both breaking by design with no compatibility shim, and they are
# coupled: socket-udp 4.0.0 pins buffer 6.23.0, and network-monitor cannot be bumped alone because
# socket core would resolve up to an API it was not compiled against.
#   (a) socket PR #273 is the socket-side of buffer #325 above (UdpSocket.bind/bindMulticast now return
#       AddressedDatagramChannel, connect() returns ConnectedDatagramChannel).
#   (b) socket PR #272 replaces `availability` + `networkId` — two StateFlows nothing kept coherent, so
#       a consumer could read UNAVAILABLE beside a live Link — with ONE sealed `NetworkState` on ONE
#       flow: Unknown / Offline / LinkLocal(id) / Routable(id, InternetAccess), the link -> route ->
#       internet ladder. `mechanism` becomes `capability`, whose `resolution` is answerable BEFORE
#       subscribing (Android RouteAndInternet, Apple/Linux/JVM RouteOnly, Node/browser LinkOnly).
#       `isTransient` is the predicate that matters to us: on real hardware (Realme RMX3933, API 35)
#       Android grants INTERNET ~0.7-1s before VALIDATED on every reassociation, so without it an
#       IceRestartPolicy.OnNetworkChange would restart the session on every Wi-Fi reassociation.
# 4.1.0 (socket PR #281) is the socket-side half of buffer #330 above, and the only change over 4.0.2:
# every socket-udp actual now ADVERTISES `requiresNativeMemoryBuffers` instead of leaving it at the
# conservative `false` — linux io_uring `true`, Apple NW + POSIX `true`, JVM/NIO `false`, Node `false`.
# The two halves must move together (4.1.0's POM pins buffer 6.25.0), and together they are the seam
# webrtc#131 consumes to reject an unusable injected bufferFactory at construction rather than at the
# first connectivity check.
# 4.1.3 is three patch releases over 4.1.0, two of which are unicast-`bind()` fixes on the exact two
# platform actuals this library rides, and one that is inert here:
#   - 4.1.1 (socket PR #283) stops `UdpSocket.linux.kt` setting SO_REUSEADDR on the *unicast* bind. The
#     option is documented as multicast-only (it is what `bindMulticast` needs to share 224.0.0.251 /
#     ff02::fb); on a unicast bind it lets a second socket overlap the first and take its packets. The
#     rest of that PR is a socket-quic establishment gate we do not consume.
#   - 4.1.2 (socket PR #284) is the same fix for `UdpSocket.apple.kt`. Darwin had been called immune when
#     Linux was fixed, but that was measured only on *exact-duplicate* binds; wildcard-vs-specific is a
#     different kernel check, and it is the overlap this library actually produces — `UdpDatagramBinder`
#     binds a specific host:port for every ICE candidate while `MulticastMdnsEndpoint` binds the wildcard.
#   - 4.1.3 (socket PR #285) is a QUIC close reason and Android-emulator CI diagnostics: nothing we call.
# This does NOT move the buffer pin. socket-udp 4.1.1/4.1.2/4.1.3 all still pin buffer 6.25.0, so the
# deliberate resolve-up to buffer 6.26.0 recorded above is neither helped nor worsened by this bump.
# 4.2.0 is four releases over 4.1.3, and exactly one of them is why this bump exists:
#   - 4.1.4 / 4.1.5 (socket PRs #294, #295, #288) are socket-quic-quiche fixes (a JDK-21-preview FFM
#     call, a missing Apple test-suite member) plus Android-emulator CI diagnostics. We consume no QUIC
#     module. Inert here.
#   - **4.1.6 (socket PR #297) publishes socket-udp's six tvOS/watchOS targets** — the upstream half of
#     webrtc#127, which had been open on exactly this. socket-udp now matches root :socket and
#     :network-monitor at eleven Apple targets. NOT purely additive, and that is the part to watch: #297
#     also RELAYOUT the Apple sources we already ship on macOS/iOS — `AppleSocketAddress.kt`,
#     `NwUdpDatagramChannel.kt`, `PosixUdpDatagramChannel.kt`, `MulticastPosixUdpDatagramChannel.kt` and
#     `UdpSocket.apple.kt` moved from `appleMain` to a per-target `src/appleNativeImpl/kotlin` srcDir,
#     leaving only `AppleUdpShared.kt` behind. The reason is arm64_32: an `appleMain` metadata
#     compilation type-checks one source against every Apple target at once, and watchosArm64's 32-bit
#     `size_t`/`ssize_t` make the memcpy lengths "numbers with different bit widths". Source-compatible
#     for us — we reference none of the moved symbols, and `UdpSocket.bind`/`bindMulticast` stay `expect`
#     in socket-udp's commonMain, so our cross-family `socketMain` still resolves them from metadata.
#   - 4.2.0 (socket PRs #299, #300 + #286) is two commits over 4.1.6:
#       · #299 is the ALPN-demultiplexed QUIC listener. It touches socket-quic, socket-quic-quiche,
#         socket-http3 and socket-testsuite ONLY. Zero impact here. NOTE for anyone reading "ALPN /
#         shared UDP port" and expecting the WebRTC-relevant seam: the RFC 9443 first-byte classifier
#         that splits STUN/DTLS/TURN/RTP from QUIC on ONE port — `MultiplexedProtocol`,
#         `classifyMultiplexedDatagram`, `AddressedDatagramChannel.demultiplex()`, `TurnRelays` — lives
#         in **socket-udp** and is NOT in this release. It is socket commit 622f1660 on the unreleased
#         branch `feat/rfc9443-shared-udp-port` (verified at the tree: `git show
#         v4.2.0:socket-udp/src/commonMain/.../MultiplexedProtocol.kt` does not exist). That is the
#         ARCHITECTURE §11.6 "share one demuxed socket with QUIC-P2P" seam; revisit when it ships.
#       · #300/#286 add `NetworkMonitor.linkQuality` (a `LinkQuality.Rssi`/`Unavailable` StateFlow) and
#         `observationCount` (callback density, an instability trend input), both interface members with
#         defaults, and fold Android's per-UID `onBlockedStatusChanged` into `BlockReason.Suspended`.
#         We consume NONE of it deliberately: no ICE decision keys off an RSSI trend today, and
#         `linkTopology()` erases the whole `InternetAccess` field, so a per-UID block is invisible to us
#         by construction. The one thing to know is a SHAPE change: `MonitorCapability` gained a third
#         parameter (`linkQuality`, defaulted, appended last), so it is source-compatible but its
#         `equals`/`hashCode`/`copy`/`componentN` all changed. Our single positional construction
#         (LinkTopologyTest) still compiles precisely because the parameter is last; a future release
#         inserting one mid-list would break it silently.
#   - 4.4.0 is twenty-odd commits over 4.2.0. Four touch surfaces we consume: #313 (`NetworkMonitor
#     .observations`, additive beside the `state` that `linkTopology()` folds), #315/#319 (trace-format
#     observation-sequence gaps, a defaulted `droppedBefore` — the v1 handset capture still decodes,
#     proven by `DeviceFlapReplayTest` at 4/0/0), #316/#317 (`transientNow` seam on FallbackTransport,
#     defaulted to today's behaviour) and #303/#341, which replace `socket-udp`'s `sendWithBackpressure`
#     polling ladder with an OP_WRITE readiness wait. That last one is OUR SEND PATH; upstream still
#     asserts `sendDoesNotConsumeCallerBuffer`, which is this repo's "`send` does not consume" trap, so
#     the invariant we ride is pinned on their side rather than merely believed.
#     `DatagramCapabilities.requiresNativeMemoryBuffers` is unchanged from 4.1.0 through 4.4.1.
#   - 4.4.1 is ONE commit over 4.4.0 — `fix(quic): stream read policy is a fixed 15s deadline,
#     independent of the connection's idle timer` (#346). It touches `socket-quic` only, which this repo
#     does not depend on at any coordinate (see [libraries]: socket-udp, socket, network-monitor,
#     socket-testkit). Taken to stay on the latest published pin, not for any fix we consume.
# The buffer pin does NOT follow socket's, and since 4.4.0 that is load-bearing rather than incidental:
# socket-udp's POM declares **buffer 6.28.0**, the one version in that line to never resolve to (see the
# `buffer` pin above). It stays out of the graph only because ours is higher and Gradle resolves UP —
# verified rather than assumed, `:webrtc:dependencies` reports `com.ditchoom:buffer:6.28.0 -> 6.29.0`.
# Never let this repo's buffer pin fall to or below 6.28.0, whatever socket's POM says.
socket = "4.4.1"
ksp = "2.3.10"
androidxCore = "1.18.0"
androidxTestRunner = "1.7.0"
androidxTestRules = "1.7.0"
androidxTestCore = "1.7.0"
androidxTestJunit = "1.3.0"
kotlinWrappers = "2026.6.0"
# Jazzer — coverage-guided fuzzing driver for the pure-Kotlin parsers (STUN/SDP/SCTP);
# runtime-only on the fuzz tasks, never a test dependency. Wired in W1.
jazzer = "0.30.0"
# kotlinx-benchmark — parse/crypto throughput benchmarks in a shared commonBenchmark source set
# (the buffer pattern); results tracked in PERFORMANCE.md. Runs on demand + release, JVM + Linux K/N.
kotlinxBenchmark = "0.4.17"
# Robolectric — the Android framework on the HOST JVM, so `ConnectivityManager` reactivity is a normal
# `testAndroidHostTest` run with no emulator. Android is the only target whose NetworkMonitor trigger had
# no runtime proof (webrtc#104); every other one asserts against a real platform API. 4.15.1 ships SDKs up
# to 35, below our compileSdk 36, so the tests pin `@Config(sdk = ...)` rather than inherit it.
robolectric = "4.16.1"

[libraries]
buffer = { module = "com.ditchoom:buffer", version.ref = "buffer" }
buffer-flow = { module = "com.ditchoom:buffer-flow", version.ref = "buffer" }
buffer-codec = { module = "com.ditchoom:buffer-codec", version.ref = "buffer" }
buffer-codec-processor = { module = "com.ditchoom:buffer-codec-processor", version.ref = "buffer" }
buffer-crypto = { module = "com.ditchoom:buffer-crypto", version.ref = "buffer" }
socket-udp = { module = "com.ditchoom:socket-udp", version.ref = "socket" }
network-monitor = { module = "com.ditchoom:network-monitor", version.ref = "socket" }
socket-core = { module = "com.ditchoom:socket", version.ref = "socket" }
# socket's published test harness — TEST SOURCE SETS ONLY. We take exactly two things from it:
# `TraceEvent.parseAll` and `networkMonitorScriptFromTrace`, which decode the v1 network-trace format
# socket's `NetworkMonitorRecorder` emits. That is what lets a flap CAPTURED FROM A PHYSICAL ANDROID
# HANDSET replay through our own trigger on every platform with no device attached (webrtc#113). The
# monitor it feeds, `ScriptedNetworkMonitor`, needs nothing from here — it ships in :network-monitor,
# and its KDoc names this repo's IceRestartPolicy.OnNetworkChange as the intended consumer.
# Note it pulls `com.ditchoom:socket` core transitively (not just :network-monitor), which is why it is
# confined to test source sets and never reaches a published artifact's POM.
socket-testkit = { module = "com.ditchoom:socket-testkit", version.ref = "socket" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidxTestRules" }
androidx-test-core-ktx = { module = "androidx.test:core-ktx", version.ref = "androidxTestCore" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
kotlin-web = { module = "org.jetbrains.kotlin-wrappers:kotlin-web", version.ref = "kotlinWrappers" }
kotlin-js = { module = "org.jetbrains.kotlin-wrappers:kotlin-js", version.ref = "kotlinWrappers" }
jazzer = { module = "com.code-intelligence:jazzer", version.ref = "jazzer" }
kotlinx-benchmark-runtime = { module = "org.jetbrains.kotlinx:kotlinx-benchmark-runtime", version.ref = "kotlinxBenchmark" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

