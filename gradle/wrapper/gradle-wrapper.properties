distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.0-bin.zip
networkTimeout=10000
# The wrapper fetches the distribution itself, and by DEFAULT gives up after one try — the log line is
# `Attempt 1/1 failed. Reason: ...`, which reads like a retry happened. On 2026-08-12 services.gradle.org
# served intermittent 503s and truncated responses for ~2.5 hours and killed jobs across four workflows
# on both open PRs, worst in `compute-version`: a ~10-second query every other lane depends on, so losing
# one coin flip skipped build-linux, build-apple, consumer-smoke and validate together. It lost three in
# a row.
#
# `retries` counts ADDITIONAL attempts (retries=5 logs `Attempt 1/6`) and the back-off DOUBLES from
# `retryBackOffMs` — measured against this exact wrapper jar: retries=3 + 1000ms took 7s, i.e. 1+2+4. So
# this is 6 attempts over ~62s of back-off, plus up to 6 × the 10s networkTimeout above.
#
# This belongs here rather than in the workflows because `./gradlew` is the only way anything invokes
# Gradle in this repo: it covers all 14 CI call sites, consumer-smoke's throwaway GRADLE_USER_HOME (where
# `-g` redirects the wrapper's own download, so that lane refetches the whole distribution every run) and
# a developer's laptop, with no per-lane step to keep in sync. A sustained outage still stops CI, as it
# should; this buys the blips.
#
# `./gradlew wrapper` REGENERATES this file and drops these comments — re-add them with the values.
retries=5
retryBackOffMs=2000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
