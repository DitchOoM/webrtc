# coturn config for the L2 harness — a real STUN + TURN server so the peers gather genuine
# server-reflexive (srflx) and relay candidates against a real implementation (not the vnet's model).
#
# Long-term credentials (RFC 8489 §9.2.2) — coturn derives MESSAGE-INTEGRITY's key as
# MD5(user:realm:pass) from the user table below, and webrtc-ice's TurnAllocation derives the same key
# via `longTermCredentialKey`. Values are substituted at container start from harness.env by the
# entrypoint. NOTE: the entrypoint must NOT pass `-n` — that flag means "ignore the config file" and
# makes every directive here inert (see entrypoint.sh).

# Listen for STUN + TURN on the UDP port (harness.env STUN_PORT). TCP/TLS not needed — WebRTC ICE is UDP.
listening-port=__STUN_PORT__
fingerprint

# The single fixed user the peers authenticate as. `lt-cred-mech` is what makes coturn challenge with
# 401 + REALM + NONCE and then verify MESSAGE-INTEGRITY under the long-term key — without it (or with
# the config unread) coturn accepts unauthenticated allocations and the lane proves nothing.
lt-cred-mech
user=__TURN_USER__:__TURN_PASS__
realm=__TURN_REALM__

# Relay allocation port range — keep small + pinned so docker-compose can expose/allow exactly it.
min-port=__TURN_MIN_PORT__
max-port=__TURN_MAX_PORT__

# NOT here: `stale-nonce`, `max-allocate-lifetime` and `user-quota`. They are the three behaviours whose
# coturn DEFAULTS (600 s / 3600 s / unlimited) outlive every lane, so they are appended per lane by the
# entrypoint from TURN_STALE_NONCE / TURN_MAX_ALLOCATE_LIFETIME / TURN_USER_QUOTA — see harness.env. Set
# them here and they would apply to the whole matrix, which is the opposite of what the lanes want.

# The listening/relay addresses coturn hands out (= its public-net IPs, per family) are APPENDED by the
# entrypoint, gated on family: always the v4 address; the v6 address too when COTURN_IP6_ENABLED=1
# (compose.ipv6.yml), and the v4 address is dropped when COTURN_IP4_DISABLED=1 (compose.v6only.yml). This
# keeps the v4 lane binding only v4 (an unassigned listening-ip makes coturn abort) and serves both families
# from ONE coturn on the dual/v6 lanes.
#
# Deliberately NO `external-ip` alongside them — coturn is not behind NAT here, and a bare one is accepted
# only ONCE and then applied to every family, which reported IPv6 allocations at the v4 address and cost
# the dual lane its relay path (443 Peer Address Family Mismatch). Full account in entrypoint.sh.

# Harness hygiene: no TLS cert needed, quiet-ish logs, no multi-tenant, allow loopback for healthcheck.
no-tls
no-dtls
no-cli
simple-log

# Keep the operational log on STDOUT, where `docker compose logs coturn` (and therefore the diag bundle)
# can see it. WITHOUT this, coturn opens /var/tmp/turn.log during startup — `INFO: log file opened:
# /var/tmp/turn.log` — and every session event after that goes to a file INSIDE the container that nothing
# copies out. A `relay-only` failure then had a coturn log containing the startup banner and nothing else:
# no allocations, no permissions, no refusals, i.e. none of the evidence the lane exists to produce.
# `simple-log` alone does not do this; it only shapes the timestamp format.
log-file=stdout

# Session-level detail: allocations, CreatePermission, the 5-tuples, and any refusal. This is what turns
# "the relay lane went red" into "peer B's permission for peer A's relay never landed" without reading a
# pcap by hand. Affordable because the log is only ever COPIED OUT on failure (collect_diagnostics) —
# a green lane pays the writes and discards them with the container.
verbose
