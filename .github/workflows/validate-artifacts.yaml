name: "Validate Artifacts"

# Reusable lane: merge the Linux + Apple maven-local halves into one repo (`maven-local-merged`),
# then validate the published shape a consumer would resolve — every expected module + target
# variant is present, POMs and Gradle module metadata exist, and the version is consistent.
#
# This is the deliberate gate the socket #188 lesson enforces: every published artifact — including
# webrtc-testsuite — goes through validation from its first release, so a broken/absent variant is
# caught here, not by a downstream consumer.

on:
  workflow_call:
    inputs:
      version:
        description: "Version being validated"
        required: true
        type: string

jobs:
  validate:
    name: "Merge + validate maven-local"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Download linux maven-local
        uses: actions/download-artifact@v8
        with:
          name: maven-local-linux
          path: /tmp/maven-local-merged

      - name: Download apple maven-local
        uses: actions/download-artifact@v8
        with:
          name: maven-local-apple
          path: /tmp/maven-local-merged
        continue-on-error: true

      - name: Validate module presence + metadata
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          root="/tmp/maven-local-merged/com/ditchoom"
          modules="webrtc webrtc-sdp webrtc-stun webrtc-ice webrtc-dtls webrtc-sctp webrtc-testsuite"

          # Say what the tree ACTUALLY holds before judging it against `version`. The two disagreeing is
          # the failure this job is most likely to see and was, until run 31504316359, the one it
          # reported worst: every module read as "missing umbrella artifact" when in fact every module
          # was present, under a different number (the build lane re-derived the version mid-run and
          # published 0.33.2 while this job was handed 0.33.1). "Missing" sent the investigation looking
          # for a publishing bug; the tree had the answer the whole time.
          if [ ! -d "$root" ]; then
            echo "::error::the merged maven-local artifact has no com/ditchoom tree at all — nothing was published"
            exit 1
          fi
          echo "=== versions present in the merged repo ==="
          present=$(find "$root" -mindepth 2 -maxdepth 2 -type d -exec basename {} \; | sort -u | tr '\n' ' ')
          echo "  ${present:-<empty>}"
          echo "=== expected: $version ==="

          fail=0
          for m in $modules; do
            # KMP publishes an umbrella module plus per-target modules (e.g. webrtc-stun-jvm).
            umbrella="$root/$m/$version"
            if [ ! -d "$umbrella" ]; then
              # No nullglob: an unmatched glob stays literal and fails `-d`, which leaves `found` empty.
              # Turning nullglob on would also empty the `ls "$umbrella"/*.pom` globs below, where an
              # argument-less `ls` lists the CWD and the check passes on nothing.
              found=""
              for d in "$root/$m"/*/; do [ -d "$d" ] && found+="$(basename "$d") "; done
              if [ -z "$found" ]; then
                echo "::error::$m: nothing published at all under $root/$m (expected $version)"
              else
                echo "::error::$m: published [${found% }], expected [$version]. The build lane and this job disagree on the version; both must come from the run's single \`version\` job."
              fi
              fail=1; continue
            fi
            pom=$(ls "$umbrella"/*.pom 2>/dev/null | head -1 || true)
            module=$(ls "$umbrella"/*.module 2>/dev/null | head -1 || true)
            [ -n "$pom" ]    || { echo "::error::$m: no .pom in $umbrella"; fail=1; }
            [ -n "$module" ] || { echo "::error::$m: no Gradle .module metadata in $umbrella"; fail=1; }
            # jvm variant is present on every lane and must always exist.
            [ -d "$root/$m-jvm/$version" ] || { echo "::error::$m: missing -jvm variant"; fail=1; }
            echo "  ok: $m@$version"
          done
          [ "$fail" = 0 ] || { echo "=== artifact validation FAILED ==="; exit 1; }
          echo "=== all modules present + well-formed ==="

      - name: Upload merged maven-local
        uses: actions/upload-artifact@v7
        with:
          name: maven-local-merged
          path: /tmp/maven-local-merged
          retention-days: 3
