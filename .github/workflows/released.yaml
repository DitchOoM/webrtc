name: Create release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  release:
    name: Release pushed tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # `v0.2.0` → `0.2.0`. GitHub expressions have no substring function, so the tag is stripped here
      # and handed to the consumer lane as a job output.
      - name: Derive version from tag
        id: version
        env:
          tag: ${{ github.ref_name }}
        run: echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
        run: |
          if gh release view "$tag" --repo="$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $tag already exists, skipping creation"
          else
            gh release create "$tag" \
                --repo="$GITHUB_REPOSITORY" \
                --title="${GITHUB_REPOSITORY#*/} ${tag#v}" \
                --generate-notes
          fi

  # The POST-release consumer gate for a **hand-pushed** tag.
  #
  # This workflow only runs on a real `push` event, which the ordinary release flow no longer produces:
  # since #128 `merged.yaml` creates the tag through the REST API with `secrets.GITHUB_TOKEN`, and GitHub
  # does not dispatch workflow events for refs created with that token. The normal path is therefore
  # `merged.yaml`'s own `consumer-smoke-central` job, which hangs off `publish` instead of off the tag.
  # What remains here is the fallback for a tag pushed by a human (as v0.14.0's was), so that path still
  # gets a release and still gets verified against Central.
  #
  # Resolve from Maven Central and NOTHING else, cold, as an outside project would — this proves the
  # publish itself. It polls for Central's eventual consistency rather than racing it.
  consumer-smoke-central:
    name: Consumer smoke from Maven Central
    needs: release
    uses: ./.github/workflows/consumer-smoke.yaml
    with:
      version: ${{ needs.release.outputs.version }}
      source: central
      include-macos: true
